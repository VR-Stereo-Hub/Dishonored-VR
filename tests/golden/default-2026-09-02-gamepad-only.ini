M7PosZ=0.0000

[Overlay]
; DevTools=0 shows the probes, rig tests and the SpaceBases oracle.
; Off = just the settings a player actually tunes.
DevTools=0

[Hands]
CrawlTuck=0
; 31.6 - THE hands system. Arkane authored per-hand SkelControls in the
; player's AnimTree (LookAtControl_LeftHand / _RightHand) and left them live
; at strength 1.0. Driving those puts each hand on its own controller through
; the engine's own animation pass, so authored animation keeps playing and
; nothing restamps our writes. Controls are matched by NAME - object order is
; not stable across loads.
Enabled=1
FromControllers=1
; Proven by the F8 pin test: with WorldSpace=1 you can walk away from your
; hands, so the position really is absolute world space.
WorldSpace=1
Position=1
Rotation=0
; The piece that was missing. Position alone left the arms ROTATING with your
; head, because the orientation still came from the animation on a
; camera-locked component. This drives the hand's world orientation from the
; controller as well.
WorldRotation=0
RollGain=1.00
AddToAnim=1
ScaleUU=44.0
ClampUU=120.0
Space=3
Strength=1.00
LTrimFwd=0.0
LTrimRight=0.0
LTrimUp=0.0
RTrimFwd=0.0
RTrimRight=0.0
RTrimUp=0.0
; Yaws the hands back by however far your head has turned since neutral.
; Raise until turning your head stops taking them with it.
CounterHeadYaw=0.00
RemoveMeshRotation=0
CameraLookAtStrength=0.00
LeftControlStrength=1.00
RightControlStrength=1.00
HandSize=1.00
WorldScaleUU=100
NeutralLRight=0.0293
NeutralLUp=-0.2058
NeutralLFwd=0.3994
NeutralRRight=0.2595
NeutralRUp=-0.3314
NeutralRFwd=0.3343
NeutralSaved=1
CrouchOffLFwd=0.0
CrouchOffLRight=0.0
CrouchOffLUp=0.0
CrouchOffRFwd=5.0
CrouchOffRRight=28.0
CrouchOffRUp=-16.0
