; Dishonored VR config — edit while game is closed
; (auto-refreshed when the mod's defaults change)
[Meta]
Version=9
[Tracking]
; Raises or lowers your view, metres. Also on the F10 overlay.
HeightOffsetM=-0.090
; Ducking in real life makes Corvo crouch, not just lower the camera - without
; this his collision stays standing and you cannot get under a table.
PhysicalCrouch=1
CrouchDropM=0.22
CrouchStandM=0.14
; head tracking drives the game camera via mouse emulation.
; Calibrate: pick a landmark, turn your head 90 degrees; if the
; world turns less than you did, RAISE CountsPerDegree; if more, lower.
Enabled=1
FindMesh=0
YawCountsPerDegree=11.5
PitchCountsPerDegree=11.5
InvertPitch=0
[Screen]
SpoofDesktopW=4096
SpoofDesktopH=2304
RenderWidth=4032
RenderHeight=2268
PinBackbuffer=0
; FillView=1 shows the game at TRUE 1:1 scale: the image spans exactly
; the FOV the game rendered (GameFOVDeg). To shrink the black border,
; raise the game's FOV (in-game slider, max 85 — or set m_fDefaultFOV in
; Documents\My Games\Dishonored\DishonoredGame\Config\DishonoredCamera.ini
; to 95-100) and set GameFOVDeg to the SAME number. A squarer game
; resolution (e.g. 1600x1200 windowed) also fills more vertical view.
; FillScale >1 grows the image to fill the border (mild zoom); live keys
; F1 (smaller/crisper) and F2 (bigger/fills more). FillView=0 = fixed
; floating screen of WidthMeters instead.
FillView=1
GameFOVDeg=100
FillScale=0.84
FovLever=130
ZoomFillFloor=1.00
ForceClientRect=0
DistanceMeters=1.79
WidthMeters=4.8
MenuFillScale=1.00
; 38.62 spectator mirror: what the DESKTOP WINDOW shows (headset unaffected).
; 0 = raw SBS pair, 1 = left eye 16:9 (for OBS/streaming), 2 = right eye.
MirrorMode=1
; desktop window size (the headset render is unaffected)
DesktopWindowW=1600
DesktopWindowH=900
[Mode]
GamepadOnly=1
; 1 = old stage-1 theater screen (no head-driven camera)
ForceTheater=0
[Stereo]
; Render-time stereo: shears the view-projection matrix per eye.
; Toggle live: F7.  Separation -/+ : F10/F11.  Convergence cycle: F12.
; If depth looks inside-out, negate Separation. If the world warps,
; set Transpose=1. TIP: turn OFF in-game Motion Blur (Options>Video)
; to remove the blur when moving.
Enabled=1
FindMesh=0
Register=0
Separation=0.014
Convergence=140.0
Transpose=0
[HeadInject]
; F3 = drive the engine camera with your head (experimental). F5 = recenter.
; If head look goes the WRONG way on an axis, flip its sign to -1.
FlipYaw=1
FlipPitch=1
FlipRoll=1

[PosTrack]
CrouchEyeDrop=0
DeepCrouch=0
; Stage 5: positional head tracking - lean/peek/crouch with your real head.
; F4 = toggle, F5 = re-center to your current head position.
; Scale = game units per meter (~50). Raise if lean feels weak, lower if too strong.
; If leaning LEFT moves the world the wrong way set FlipX=1.
Enabled=1
FindMesh=0
Scale=98.0
MaxMeters=0.80
FlipX=0

; roomscale: lean further than RoomDeadM and Corvo WALKS there and the
; reference recenters. 0.14 ate corner-peeks - leans under this stay leans.
RoomDeadM=0.35
RoomBleedMS=0.45
[Controllers]
; Stage 6.4: Index controllers = virtual Xbox-360 pad via SteamVR's ACTION
; input system (rebindable in SteamVR > Settings > Controllers > Bindings).
; Left stick = move. Right stick X = turn (Y = head only in gameplay).
; R trigger = right hand (sword)   L trigger = left hand (power/gun)
; R A = JUMP + menu confirm        R B = stealth + menu back
; L A = interact/use               L B = pause menu
; L trackpad press = power wheel   R trackpad press = zoom
; R grip = choke/attack            L grip = adrenaline (Y)
; L stick click = sneak (LS)       R stick click = RECENTER lean
; Head-mouse auto-pauses while a menu (visible cursor) is open.
Enabled=1
FindMesh=0
Deadzone=0.12
Haptics=1

[Debug]
Probe=
KillMask=0
IntroSkip=2
IntroSkipDelayMs=6000
; Fire-aim tracer (motion-controls R&D). 1 = on (costs fps), 0 = off.
FireTrace=0
; VsScan=1 re-enables the shader-constant scanner. It runs on every single
; matrix upload (millions per minute) — leave it 0 unless diagnosing.
VsScan=0

[MotionAim]
; Stage 7.3: hand-aimed projectile weapons (crossbow bolts, pistol
; bullets, grenades). After you pull the fire trigger, the freshly
; spawned projectile is redirected along your controller's ray.
; Hand: which controller aims (left = Corvo's gun hand). PitchOffsetDeg
; tilts the ray down from the controller's raw pose toward a natural
; point (tune live: PageUp = shots land higher, PageDown = lower,
; 5 deg steps; the log prints the value - copy your favorite here).
; FlipRight/FlipUp=1 mirror the ray if left/right or up/down aim is
; reversed. End key = toggle on/off live.
Enabled=1
SwarmAim=0
FindMesh=0
Hand=left
PitchOffsetDeg=40
WindowMs=1200
MaxDistUU=900
FlipRight=0
FlipUp=0

[Weapon]
; Stage 8.0: first-person weapon-mesh motion-control R&D.
; Diag=1 logs the distinct view-projection "clusters" the game uploads each
; frame so we can find the weapon's own VP (a minority cluster with a
; different FOV) vs the world's. Press HOME for an on-demand dump. Diag costs
; a little fps; turn it off (0) once we've identified the weapon VP.
; Enabled is the real feature (moves the weapon) — off until 8.1.
Diag=0
; Enabled=1: the first-person weapon mesh follows your aim hand (HOME key
; toggles live). TestYawDeg: debug — a nonzero value rotates the weapon by a
; FIXED yaw instead of the hand (proves the right thing moves). FlipX/FlipY
; mirror the hand motion if left/right or up/down comes out reversed.
Enabled=0
FindMesh=0
TestYawDeg=0
FlipX=0
FlipY=0
; --- Stage 10: decouple the first-person mesh from the head ---
; Attach=1 rotates any drawn object whose world position sits within
; AttachRadius of the camera (= the arms/weapon) onto your controller ray.
; HOME toggles it live. If nearby props/walls swing too, LOWER AttachRadius;
; if nothing moves, RAISE it. ShowNear logs the nearest draws every 3 s.
Attach=0
AttachRadius=250
ShowNear=0
; ALL-mode size gate: only skeletons with <= MaxBones bones follow the
; hand. NPC bodies are 24-68 bones; the FP weapon is 10-14.
MaxBones=20
; 6DoF: how far the weapon travels per metre of real hand movement
; (game units per metre), and the clamp on that travel.
PosScale=55
PosMax=140

[HeadTrack]
; Native=1 writes your head pose straight into the engine (real 1:1
; tracking with roll) instead of faking mouse movement. F3 toggles it live,
; F5 recentres forward. Set 0 to go back to mouse emulation.
Native=1
; Roll=1 tilts the engine view when you tilt your head. It fights the lean
; system, so it is off by default — try it once lean feels right.
Roll=0

[Perf]
; The game normally syncs to your MONITOR, capping frames at its refresh.
; The headset runs off its own clock, and each game frame is one eye — so a
; 145Hz monitor cap means only ~72 per eye. Forcing immediate present lets
; the GPU run flat out. Set 0 to restore the game default.
ForceNoVSync=1
; How closely a skeleton must match the one you assigned before it moves
; with your hand. Lower = stricter (fewer world objects caught by mistake).
MeshTolerance=0.35

[HandRender]
; Build 30.70 - THE render-time hand/weapon drive.
; The drawn pose reaches the GPU as vertex constants at c6, three registers
; per bone. One shared rigid transform is applied there, built from your
; controller RELATIVE TO YOUR HEAD, so head motion cancels analytically and
; the weapon stops drifting with your view. Enabled=0 falls back to the old
; component drive. HOME is still the master on/off; END recaptures neutral.
Enabled=0
DriveArms=1
DriveWeapon=1
; Upload sizes that identify each rig. Both get the SAME transform, so which
; label lands on which size does not change behaviour - it only decides which
; one WpnYaw/Pitch/Roll applies to. WHICH of 36 and 144 is the sword is still
; open: settle it with the identifier in the F10 overlay (it wiggles one size
; at a time while you watch), then press the assign button. 0 = drive nothing.
WeaponRegs=36
ArmsRegs=144
Hand=right
; 0 = the rig pivots about the viewpoint, 1 = about your hand (spins in place).
PivotMix=1.00
; Unreal units per metre of hand travel. 0 = follow [PosTrack] Scale.
ScaleUU=0
MaxOffsetUU=120
; 0 = raw pose. Raise toward 0.9 only if the hands look jittery.
SmoothAlpha=0.00
; RotInvert=1 is the one fix if the weapon turns the WRONG way.
; RotScale=0 removes rotation and leaves pure translation - use it to tell
; which half of the drive is misbehaving before tuning anything.
RotInvert=0
RotScale=1.00
; The pivot assumes the rig's origin is at your eye. If rotation swings the
; arms from somewhere below you, slide it back (unreal units).
PivotUp=0
; Resting trim in rig space, unreal units: X forward, Y right, Z up.
; THIS IS THE ONE THAT MATTERS. The drive assumes the game's rest hand sits
; where your controller was when you pressed END; whatever is left over stays
; glued to your head. Trim by minus the visible error and the drift goes to
; zero (measured: 10 uu of error = 28 cm of swim per 90 degrees of head turn).
; If the weapon and the hand pull APART, the weapon's component axes differ
; from the arms'. These degrees rotate the weapon's copy of the transform to
; match. Tune them live in the F10 overlay.
WpnYaw=0.0
WpnPitch=0.0
WpnRoll=0.0
; --- 30.71: two independent hands ---------------------------------------
; Left and right controllers now drive separate transforms. The ARMS rig is
; 48 bones, so it can be split: bones [RightArmFirstBone, RightArmLastBone)
; follow the right controller, everything else follows the left. 0/0 = no
; split (whole rig on one hand). Find the boundary with the range preview in
; the F10 overlay - it wiggles just that range so you can see which limb moves.
RightArmFirstBone=0
RightArmLastBone=0
WeaponHand=1
Weapon2Regs=0
Weapon2Hand=0
; ShowRings=1 pins a bright ring to each controller (cyan left, orange right)
; so you can SEE where your real hands are in the headset. Park a ring on the
; in-game hand and press END - that is the whole calibration.
ShowRings=0
RingSizeMeters=0.045
; Lower ONLY if looking up/down still drags the hands (1.0 = the rig follows
; head pitch fully, which is what a camera-locked first-person rig should do).
; Per-hand fine trim, rig units: X forward, Y right, Z up.
LTrimX=0.0
LTrimY=0.0
LTrimZ=0.0
RTrimX=0.0
RTrimY=0.0
RTrimZ=0.0
; --- 30.72: which frame do the weapons actually live in? -----------------
; 1.00 = the rig's axes rotate with the camera (the original assumption).
; 0.00 = the rig is world-aligned and only its ORIGIN follows the camera.
; Sweep these until turning your head stops dragging the weapons; whichever
; value nulls it is the answer. The F10 "Measure it instead" button logs the
; same thing objectively (turn slowly on the spot for 6 s).
FollowHeadYaw=1.00
FollowHeadPitch=0.00
; The two arms are separate DRAWS of the same bone count, so bone-index
; splitting cannot separate them - route by draw order instead. One entry per
; draw: -1 = leave alone, 0 = left controller, 1 = right controller.
RouteByDrawOrder=0
DrawOrderHands=-1,-1,-1,-1,-1,-1,-1,-1
; --- 30.73: which way does each rig axis point? --------------------------
; Source: 0 = sideways, 1 = up/down, 2 = forward/back. Flip inverts it.
; Use the AXIS CHECK buttons in F10 to find out, then set these.
Axis0Source=2
Axis0Flip=0
Axis1Source=0
Axis1Flip=0
Axis2Source=1
Axis2Flip=0

[VRHands]
; 30.77 - our own hands and weapons, drawn in VR space.
; The render-time drive is retired: the game's view model is welded to the
; camera and the renderer gives us no seam to get between them. These models
; are drawn in the eye render targets at the controller pose, so the engine is
; out of the loop entirely and tracking is 1:1 with nothing to calibrate.
; HideGameArms collapses the game's own arm/weapon rigs so they do not
; double up (the one thing we CAN reliably do to those bone constants).
Enabled=0
HideGameArms=1
Scale=1.00
; 0 none, 1 sword, 2 crossbow, 3 fist only
LeftModel=2
RightModel=1
; how the weapon sits in your hand, degrees, tune live in F10
LYaw=0.0
LPitch=0.0
LRoll=0.0
RYaw=0.0
RPitch=0.0
RRoll=0.0
LPosX=0.0000
LPosY=0.0000
LPosZ=0.0000
RPosX=0.0000
RPosY=0.0000
RPosZ=0.0000
; --- 30.78 ---------------------------------------------------------------
; FollowEquipped=1 picks the model from the weapon you actually have out,
; using the same mesh-asset-name identification the weapon system already
; refreshes every 750 ms. Swap weapons in game and your hand swaps too.
FollowEquipped=1
; Every first-person rig to collapse, by upload size. The left-hand weapons
; have their own sizes (measured: 30 crossbow, 6 gun, 3 grenades), which is
; why hiding only the arms and sword left them floating.
HideSizes=3,6,30,36,144
; The crossbow's BODY is a static mesh with no bones to collapse, so it is
; caught by distance from the camera instead. Raise until it disappears;
; lower if real world props start vanishing when you stand close to them.
HideStaticParts=1
HideStaticRadiusUU=70
; Only draws that come right AFTER a hidden rig are eligible for the static
; cull. Distance alone was catching real world geometry - that was the cause
; of the invisible doors.
HideStaticDraws=6
; Extracted meshes go in the "vrhands" folder beside this file, named
; sword.obj / crossbow.obj / pistol.obj / grenade.obj / razor.obj /
; heart.obj / hand.obj. Anything missing falls back to the built-in shape.
; ObjScale converts the file's units to metres (unreal units are ~1 cm).
ObjScale=0.01
M1Yaw=0.0
M1PosX=0.0000
M1Pitch=0.0
M1PosY=0.0000
M1Roll=0.0
M1PosZ=0.0000
M2Yaw=0.0
M2PosX=0.0000
M2Pitch=0.0
M2PosY=0.0000
M2Roll=0.0
M2PosZ=0.0000
