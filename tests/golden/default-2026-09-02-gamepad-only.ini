CrouchSource=3
CrouchDropUU=20
CrouchHoldMs=100
CrouchDiag=1
CrouchToggle=0
CrouchButtonMask=8192
CrouchMaskVer=2
BlockOffLFwd=0.0
BlockOffLRight=0.0
BlockOffLUp=0.0
BlockOffRFwd=8.0
