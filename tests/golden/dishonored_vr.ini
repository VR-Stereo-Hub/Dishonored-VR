; Dishonored VR config - edit while game is closed
; (auto-refreshed when the mod's defaults change)
[Meta]
Version=10
[Tracking]
; head tracking drives the game camera via mouse emulation.
; Calibrate: pick a landmark, turn your head 90 degrees; if the
; world turns less than you did, RAISE CountsPerDegree; if more, lower.
Enabled=1
YawCountsPerDegree=11.5
PitchCountsPerDegree=11.5
InvertPitch=0
; HeightOffsetM shifts the eyes vertically (metres, negative = lower). -0.090 is the
; value the 2026-09-03/04 headset runs were judged at (it was the code default and
; unwritten before); F10 View tunes it per person, SAVE AS DEFAULTS writes it back.
HeightOffsetM=-0.090
[Stereo]
; Method=mono|aer|reentry: the rung of the stereo ladder (docs/ARCHITECTURE.md).
; reentry (ships, 41.1) draws the scene twice per tick, once per eye, into a
; projection layer - native stereo, HEADSET-VERIFIED on a Quest 3 (2026-09-03); mono
; shows the game on a head-locked screen in both eyes (the fallback, and what a
; refused method leaves running); aer is a design stub and refuses with a note.
; `stereo <name>` switches live and fails soft. Armed=1|0: whether the selected method
; RUNS (the F10 Display tickbox, `stereo arm on|off`); 0 parks the game on the mono
; screen without forgetting the selection. C5Pair=1 (41.1, session 9): each present's
; eye tag is checked against its camera step from the previous present (pass 2 sits
; exactly one IPD along right of pass 1, nothing else moves inside a tick) and the
; tag ring is realigned when they disagree - the tags rode the other draw across
; every pause, load and re-arm before (the eyes SWAPPED). 0 = the ring's order alone.
Method=reentry
Armed=1
C5Pair=1
; HoldUntagged=N (41.1): a tick that fails the second draw gates presents
; UNTAGGED, and an untagged present is the mono path - the same image in BOTH
; eyes. The error scales with disparity, so it is invisible on distant geometry
; and glaring on the viewmodel at 30-50 cm: the tester saw it as the arms and
; weapon flickering (2026-09-03, mono/s 1-4 against out/s 220). N holds up to N
; CONSECUTIVE untagged presents back - the previous pair is re-submitted, so the
; compositor genuinely keeps showing it - before letting one through as mono, so
; a real transition (menu, load, cinematic) still reaches mono within N presents.
; 3 ships: HEADSET-JUDGED on a Quest 3 (2026-09-03), mono/s 1-4 -> 0 with every
; other flicker gone. 0 = OFF, the pre-41.1 behaviour, and the A/B for it.
; `stereo hold <n>` live; `stereo status` and the beat report how many were held.
HoldUntagged=3
[Camera]
; EyeField= the camera field the per-eye offset is written to. 0x330 was measured
; 2026-09-02 with `camera eyetest` (HONOURED 119/120; docs/dishonored/ENGINE_NOTES.md,
; the per-eye camera seam); none disables the write.
EyeField=0x330
[Capture]
; Mode=sync|deferred|shared: how the game's frame reaches the headset
; (core/gfx/capture). sync reads the frame back and waits for it every present
; (the old baseline, ~5 ms per present at 1080p, 15 ms at the Quest 3 size);
; deferred copies on the GPU, queues the readback and locks it one present later
; (~2.3 ms at 1080p, ~10 ms at the Quest 3 size; the picture is one present late;
; also resolves a multisampled backbuffer; the fallback when the device cannot
; share); shared (ships, 41.1, headset-judged 2026-09-03) needs [Device] Ex=1 and
; keeps the frame in VRAM (the log's capture/probe lines say). `capture mode <m>` switches
; live; `capture status` prints the cost. shared (needs [Device] Ex=1) keeps the frame
; in VRAM: two shared render targets, each blit fenced by a D3D9 event query;
; SharedWait=0 delivers the previous present's slot (no wait in the common case),
; 1 delivers this present's after its fence (zero latency, the CPU waits for the frame
; in flight). `capture sharedwait on|off` live.
Mode=shared
SharedWait=0
[Pace]
; The pair pacing levers of the projection layer (stereo reentry), all live on
; the `vrpace` seam word and the F10 Runtime panel; SAVE AS DEFAULTS writes them.
; Ahead=0|1|2: locate the head pose (and the layer's views) this many display
; periods past predictedDisplayTime - a pair that closes after its slot displays a
; slot late, and 1 makes the pose match that slot (the log's `pair phase` line says
; which). Strict=1: a stereo submit whose eye is older than one present shows the
; fresh eye to both eyes for that frame instead of a held eye (the pause/resume
; desync fail-soft). Lag=0|1|2: which locate generation the layer is tagged with
; (1 = one back, the measured default). All ship at today's behaviour.
Ahead=0
Strict=0
Lag=1
[Perf]
; The tick budget (core/framework/perf): Instruments=1 keeps one record per present
; (eight clock stamps) and prints the `perf: tick` line every 3 s; GpuQueries=1 adds
; the D3D9 timestamp ring behind the `perf: gpu` line (read five presents back, never
; waited on). `perf on|off`, `perf gpu on|off` live; `mark <text>` and the F10 MARK
; button stamp a felt freeze. ForceNoVSync=1 presents without vsync (the game's own
; setting is ignored while the headset paces the game). FrameId=1 runs the frame-
; identity trace (core/gfx/frame_id): a 64x64 thumbnail of every present at four
; stages (the backbuffer, the shared slot, the eye texture, the swapchain image),
; read three presents later, and per left/right pair the `stereo: frameid` line
; says at which stage the two eyes stopped being two pictures. 16 KB per present;
; `frameid on|off|status` live.
Instruments=1
GpuQueries=1
ForceNoVSync=1
FrameId=1
FrameIdEvery=8
[Draws]
; The draw census (core/gfx/draw_census), default OFF. Census=1 buckets every draw in
; a present by entry point, render target, viewport, depth state, blend, whether
; texture stage 0 is a render target, pixel shader, vertex declaration and primitive
; count, and prints a table and a VERDICT line every 3 s: whether the Scaleform HUD
; draws separate from the world with NO overlap, or that they do not. It is the
; measurement the wrist HUD's return depends on, and it costs a bucket lookup per
; draw, so leave it off unless you are measuring. `draws on|off|status` live, and
; the F10 Display tickbox.
Census=0
[Hud]
; The HUD panel (core/gfx/hud_capture), default OFF. Panel=1 redirects the game's own
; Scaleform HUD draws into a private target and shows them on the runtime layer's
; HEAD-LOCKED quad instead of in the world, which is the return of the wrist HUD
; build 38.92 shipped (the wrist anchor itself comes back with the hands). While it
; is on the HUD is NOT in the eye textures and NOT in the desktop window: that is
; what a redirect means. It runs only during stereo gameplay - menus, loading
; screens, cutscenes and the mono screen all leave the HUD in the frame, and the
; pause menu deliberately so, because the menu is drawn by the same class.
; SlotScale is the panel texture's size as a fraction of the render; the quad
; subtends about 50 degrees, so half is already more than the headset resolves.
; `hud on|off|status|scale <f>` live, the F10 Display tickbox, and the quad's
; distance, width and height are the HUD sliders on the F10 Runtime tab.
Panel=0
SlotScale=0.50
[Cine]
; What the headset shows during a cutscene. quad (the default, and what has always
; happened) drops the gameplay verdict while the cinematic latch is up: the scene
; is drawn once and the runtime layer shows it on its head-locked quad, one image
; in both eyes. stereo keeps the per-eye projection through the cutscene, so it has
; depth, and the HUD panel stays live for the subtitles. Neither makes the engine's
; matinee camera follow your head - a cutscene owns the camera - so under stereo the
; picture holds its frame while you turn. Judge it in the headset: `cine stereo`,
; `cine quad`, `cine status`, and `cine latch on|off` to enter the state by hand.
Mode=quad
; HudPanel=1 keeps the HUD panel live through a cutscene, which puts the SUBTITLES
; on the panel: one image in both eyes, which is the stereo-correct place for text.
; 0 leaves them in the frame, where each eye is captured from a different game
; frame and text can double. Only bites under Mode=stereo (under quad the panel is
; down anyway and the subtitles ride the cinematic quad with the rest of the frame).
HudPanel=1
; HeadLocked=0 (the default) stands the cutscene screen in the room, so turning your
; head looks around it instead of dragging it with you. 1 glues it to your face,
; which is what [Screen] HeadLocked does for the gameplay screen and what a cutscene
; must NOT do. Only bites under Mode=quad; under stereo there is no screen at all.
HeadLocked=0
[Device]
; Ex=1 creates the game's D3D9 device as D3D9Ex (core/gfx/d3d9ex), which is what lets
; [Capture] Mode=shared keep the frame in VRAM (the CPU readback owned the tick at the
; Quest 3 size: 16 ms of GPU copy per present, measured 2026-09-03). A 9Ex device refuses
; D3DPOOL_MANAGED, which this game asks for on every static texture and buffer, so
; Managed= says what stands in: shadow (a system-memory twin per texture, locks
; redirected; the safe one - the game locks textures READONLY while streaming),
; dynamic (DEFAULT+DYNAMIC: READONLY locks read uncached VRAM), default (textures lose
; their locks), none (the refusals are the measurement). Launch-time: `device ex on|off`
; and the F10 Display tickbox write the key for the NEXT launch. Ships ON since 41.1
; (headset-judged 2026-09-03: the Quest 3 size at the headset's rate); Ex=0 is the
; plain device and the readback capture, the fallback if the 9Ex device misbehaves.
Ex=1
Managed=shadow
[Screen]
; The mono screen: a head-locked quad DistanceMeters away and WidthMeters
; wide. Per-eye rendering will replace it (docs/ROADMAP.md).
DistanceMeters=1.75
; HeadLocked=1 keeps the screen in front of your eyes (turning your head turns the
; game camera); 0 leaves it standing in the room where you recentered.
HeadLocked=1
WidthMeters=2.4
; RenderWidth/RenderHeight/RenderFullscreen (41.1): the render-resolution picker's
; ask, 0 = the game's own size. It takes effect at the NEXT LAUNCH: the size goes
; into the game's own ini (Documents\My Games\Dishonored, [SystemSettings] and the four
; AppCompat buckets, backed up once as .pre-dvr) because the engine's own setres does
; nothing on this build (measured). A fullscreen size must be a display mode the
; adapter lists (`res modes`) - or VirtualMode=1 makes the proxy advertise it and
; create the fullscreen device windowed with the backbuffer kept, the route to the
; eye's own near-square size. `res <W>x<H>[f|w]` asks live; F10 Display has the picker
; and the verdict (`res: HONOURED` reads the capture, never the requested number).
; 41.1 (session 9): the values the headset judged (Quest 3 through VirtualDesktopXR,
; 2026-09-03/04) - the runtime's recommended per-eye size, asked on the game's command
; line and ADVERTISED by the proxy so the game creates it (VirtualMode=1; without it the
; game falls back to a display mode and the picture is soft). Another headset wants its
; own size: the F10 Display picker writes these three for the next launch, and
; RenderWidth=0 RenderHeight=0 asks for nothing at all (the game's own size).
RenderWidth=2496
RenderHeight=2688
RenderFullscreen=1
VirtualMode=1
; FovLever WRITES the game camera FOV on every script dispatch (0 = off).
; FovLever writes the game's camera FOV every tick (40..160; 0 = off, the game's
; own FOV). 130 filled the old side-by-side render vertically; the mono screen
; shows the frame as the game draws it, so it ships off.
FovLever=0
[Mode]
; GamepadOnly=1 makes the VR controllers behave as a plain gamepad:
; hands, hand mesh, motion aim, motion melee, motion crouch and
; controller Blink aim are all off, and no hand or weapon model is
; scaled. Head tracking, positional tracking and the FOV lever keep
; working. Default 1 while the render is being fitted - set 0 to
; get the motion controls back.
GamepadOnly=1
[VR]
; Runtime=auto tries the 32-bit OpenXR runtime the system registers (Virtual
; Desktop's VDXR, Oculus) and falls back to the bundled SteamVR shim
; (dvr_steamvr32.dll) when there is none; native|steamvr force one.
Runtime=auto
; XrRuntimeJson= a runtime manifest for this launch (the simulator, or a
; Steam launch that cannot carry XR_RUNTIME_JSON). Empty = the loader's choice.
XrRuntimeJson=
XrHaptics=1
; FpsCap pins the game to a rate (0 = off): 72 with VD at 72 Hz, 45 at 90.
FpsCap=0
[Paths]
; DataDir= where the harness files go (command.txt, status.json, dumps, the
; shim manifest). Empty = %%LOCALAPPDATA%%\DishonoredVR. Set it to a folder the
; game and the tools both see for real (docs/VERIFICATION.md gotcha 14).
DataDir=
[Controllers]
; Stage 6.4: Index controllers = virtual Xbox-360 pad via SteamVR's
; ACTION input system (rebindable in SteamVR > Controller Bindings).
; Left stick = move. Right stick X = turn (Y = head only in gameplay).
; R trigger = right hand (sword)  L trigger = left hand (power/gun)
; R A = JUMP + menu confirm       R B = stealth + menu back
; L A = interact/use              L B = pause menu
; L trackpad press = power wheel  R trackpad press = zoom
; R grip = choke/attack           L grip = adrenaline (Y)
; L stick click = sneak (LS)      R stick click = RECENTER lean
; Head-mouse auto-pauses while a menu (visible cursor) is open.
Enabled=1
Deadzone=0.12
Haptics=1
[PosTrack]
; Stage 5: positional head tracking - lean/peek/crouch with your real
; head. F4 = toggle, F5 = re-center to your current head position.
; Lane=auto|vp|camera: where the offset is applied. vp patches the view-projection
; matrix at c0 (the mono screen's path; attachments do not follow); camera writes it
; into the camera field with the per-eye offset (game/dishonored/camera); auto = vp
; on the mono screen, camera under a projection layer (stereo), where the head's raw
; displacement drives the camera. `postrack lane <l>` switches live; `camera postest
; <R> [U] [F]` measures the travel in uu.
Lane=auto
; Scale = game units per meter. 50 is GingasVR's shipped value and is
; the baseline her release was tuned around, so it is what ships.
; NOTE: 100 is the MEASURED value (1 uu = 1 cm), derived from the
; game's own movement constants - 360 uu/s default and 540 uu/s
; sprint. At 50 those are 7.2 and 10.8 m/s, a world-record sprint
; pace for walking around; at 100 they are a 3.6 m/s jog and a
; 5.4 m/s run. Try 100 as a SINGLE change once the rest of the
; baseline is confirmed good, and keep whichever you prefer.
; Too weak? raise it. Too strong/swimmy? lower it. MaxMeters clamps
; how far it will follow.
; If leaning LEFT moves the world the wrong way set FlipX=1.
Enabled=1
Scale=98
MaxMeters=0.80
FlipX=0
[Neck]
; The pitch pivot (41.1). A real head pitches about a point below and behind the
; eyes, so looking up or down moves the eye on an arc. Mode=off|add|cancel, under
; a projection layer only: off = the tracked displacement alone; add = the
; modelled arc is ADDED (a rig without positional tracking, or an arc the tracking is
; not supplying); cancel = the arc is SUBTRACTED, for an engine that already pitches
; its camera about its own neck (then PivotBelowM/PivotBehindM hold the ENGINE's
; numbers, measured by `camera pitchtest`). `neck off|add|cancel [below] [behind]`
; switches live; F10 Comfort has the buttons and sliders. The defaults ARE the
; engine's pivot, MEASURED 2026-09-03 on the simulator (0.321 m below, 0.062 m
; behind: 17 cm of backward travel at +30 deg). cancel SHIPS: the headset run of
; 2026-09-03 judged it right (the user); off and add stay as the live A/B. A human
; neck for `add` is about 0.11 / 0.09.
Mode=cancel
PivotBelowM=0.321
PivotBehindM=0.062
[MotionAim]
; Stage 7.3: hand-aimed projectile weapons (crossbow bolts, pistol
; bullets, grenades). After you pull the fire trigger, the freshly
; spawned projectile is redirected along your controller's ray.
; Hand: which controller aims (left = Corvo's gun hand). PitchOffsetDeg
; tilts the ray down from the controller's raw pose toward a natural
; point (tune live: PageUp = shots land higher, PageDown = lower,
; 5 deg steps; the log prints the value - copy your favorite here).
; FlipRight/FlipUp=1 mirror the ray if left/right or up/down aim is
; reversed. End key = toggle on/off live.
Enabled=1
Hand=left
PitchOffsetDeg=40
WindowMs=1200
MaxDistUU=900
FlipRight=0
FlipUp=0
[HandTracking]
; Build 30.6: weapon tracking starts by itself a few seconds after
; you are in-game with both controllers tracked - no F6+HOME needed
; (F6/HOME still work manually). If the neutral pose captured badly,
; hold the controllers naturally and press END to recalibrate
; everything; HOME still toggles tracking off/on.
AutoStart=1
DelaySec=4
; Depth = hands push/pull the weapon. WristRoll = weapon rolls with
; your wrist (off by default).
Depth=1
WristRoll=0
[Melee]
; Build 30.19: swing the RIGHT controller to attack with the sword.
; A real swing above SwingSpeed (m/s) presses the attack input for
; HoldMs; CooldownMs paces combos (one swing = one strike). Your
; trigger still attacks as before. Too sensitive? raise SwingSpeed.
; Swings not registering? lower it.
Enabled=1
SwingSpeed=1.8
HoldMs=220
CooldownMs=300
[Debug]
; One-shot diagnostic, runs ~2 s after weapon tracking comes up and
; writes to the log. Values: bones census graph ue3 view. Leave empty
; for none. (Claude sets this remotely when a measurement is needed.)
Probe=
[HandRender]
; Build 30.70 - THE render-time hand/weapon drive.
; The drawn pose reaches the GPU as vertex constants at c6, three
; registers per bone. We apply one shared rigid transform there, built
; from your controller RELATIVE TO YOUR HEAD, so head motion cancels
; analytically and the weapon stops drifting with your view.
; Enabled=0 falls back to the old component drive.
Enabled=1
DriveArms=1
DriveWeapon=1
; Upload sizes that identify each rig. Both are driven by the SAME
; transform, so which label lands on which size does not change how it
; behaves - it only decides which one the WpnYaw/Pitch/Roll correction
; applies to. The 30.69 sweep saw exactly three sizes on screen (36,
; 144, 204); 204 is an NPC and is never touched. WHICH of 36 and 144 is
; the sword is still open - settle it with the identifier in the F10
; overlay, which wiggles one size at a time while you watch, then press
; the assign button. 0 = drive nothing here.
WeaponRegs=36
ArmsRegs=144
; Which controller drives the pair. Both rigs share it, so the hand
; stays welded to the weapon.
Hand=right
; 0 = the rig pivots about the viewpoint, 1 = about your hand (spins in
; place, like something actually held).
PivotMix=1.0
; Unreal units per metre of hand travel. 0 = follow [PosTrack] Scale so
; hands and world stay the same size.
ScaleUU=0
MaxOffsetUU=120
; 0 = raw pose. Raise toward 0.9 only if the hands look jittery.
SmoothAlpha=0.0
; Resting trim in rig space, unreal units: X forward, Y right, Z up.
; THIS IS THE ONE THAT MATTERS. The drive assumes the game's rest hand
; sits where your controller was when you pressed END; whatever is left
; over stays glued to your head. Trim by minus the visible error and
; the drift goes to zero (measured: 10 uu of error = 28 cm of swim per
; 90 degrees of head turn).
TrimX=0
TrimY=0
TrimZ=0
; RotInvert=1 is the one fix if the weapon turns the WRONG WAY.
; RotScale=0 removes rotation and leaves pure translation - use it to
; tell which half of the drive is misbehaving before tuning anything.
RotInvert=0
RotScale=1.0
; The pivot assumes the rig's origin is at your eye. If rotation swings
; the arms from somewhere below you, slide it back (unreal units).
PivotUp=0
; If the weapon and the hand pull APART, the weapon's component axes
; differ from the arms'. These degrees rotate the weapon's copy of the
; transform to match. Tune them live in the F10 overlay.
WpnYaw=0
WpnPitch=0
WpnRoll=0
[HeadInject]
; (legacy, unused)
FlipYaw=1
FlipPitch=1
FlipRoll=1
