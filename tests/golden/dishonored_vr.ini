[Hands]
; PoseLag (41.2, VR-68): which generation of the head the hand and the weapon are
; normalised against. The engine renders a frame from the head TWO locate generations
; back - measured, the rendered camera motion matched that sample to 0.119 deg against
; 1.19 at the freshest, over 4085 moving frames - so a hand placed against the FRESHEST
; head is planted in a view built from a different one, and the leftover is two
; generations of head rotation. That is the weapon judder, and it is the same fault the
; world had before [Pace] Lag=2 fixed it, one layer down.
; 2 is confirmed in a headset by a reversing A/B/A/B; 0 is the pre-VR-68 behaviour.
; PoseLagAb=1 walks 0/2/0/2 on 15 s segments so the comparison can be felt again.
PoseLag=2
PoseLagAb=0
