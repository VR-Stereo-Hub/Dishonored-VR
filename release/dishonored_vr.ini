; THE HUD ON ITS ANCHORS (VR-117; core/gfx/hud_class, hud_capture, hud_layout).
; Panel=1 redirects the game's own Scaleform HUD draws into private targets and shows
; them on quads in the headset instead of in the world: a WINDOW in front of the
; player and the tracked HAND (what build 38.92 shipped as the wrist HUD). While it
; is on the HUD is NOT in the eye textures and NOT in the desktop window: that is
; what a redirect means. 0 leaves the HUD in the frame, as the game draws it. If the
; hand-off to D3D11 cannot be built the redirect stays off and the HUD keeps drawing
; into the frame, because losing it entirely would be worse. Loading screens, the
; main menu, cutscenes on the mono screen and the power wheel leave it in the frame.
; `hud on|off|status` live, and the F10 HUD tab.
Panel=1
; SlotScale: each sink's texture is the render's size times this. The window subtends
; about 50 degrees, so half is already more than the headset resolves.
SlotScale=0.50
; Regions=1 reads each HUD draw's screen rectangle from its vertices (through the vertex
; shader's own transform, VR-118) and routes it to an ELEMENT by the Region.<name> table
; below; 0 routes every draw to 'default' (the whole HUD as one quad: the A/B). The
; rectangles are measured with `draws on` + `draws regions`. `hud regions on|off` live.
Regions=1
; Element.<name>=off|frame|window|world|handL|handR (VR-120): which anchor an element
; rides. 'frame' leaves it in the eye textures as the game draws it, 'off' hides it,
; 'window' is head-locked in front of you, 'world' is parked where you recentred (F5,
; `hud window recenter`), handL/handR ride the tracked hand. 'default' takes every draw
; no row claims (an element the mod has not named yet still shows, and `hud list` counts
; it); the six screens (pause, note, journal, wheel, store, missionstats) route by their
; UI owner while they ride, and take the mono screen when set off or frame. A row with
; no Region rides 'default' until `hud region <name> x0,y0,x1,y1` names one.
; Element.<name>.WinX/WinY/WinScale place it on the window or the world window,
; .HandX/HandY/HandScale on either hand (metres in the anchor's plane, a size factor).
; `hud anchor <name|all> <anchor>`, `hud place <name> window|hand <x> <y> [scale]`,
; `hud list`, the F10 HUD tab, `hud reset`.
Element.default=window
Element.vitals=handR
Element.reticle=window
; ReticleOnAim=1 (VR-166): the reticle row - centred gauges such as the grenade cook ring -
; rides the aim dot along the weapon ray (head-facing, same apparent size), and the dot
; hides while it draws. 0 = the row stays on its own anchor.
ReticleOnAim=1
Element.prompt=window
Element.equipment=window
Element.subtitles=window
Element.objective=window
Element.toast=window
Element.tutorial=window
Element.detection=frame
Element.skipgauge=window
Element.darkvision=window
Element.vignette=frame
Element.pause=world
Element.note=window
Element.journal=window
Element.wheel=window
Element.store=window
Element.missionstats=window
; Region.<name>=x0,y0,x1,y1 (normalised backbuffer, y down): the rectangle that claims
; a draw whose centre lies inside. These three are the measured ones (the sewer level,
; 2026-09-15, with a margin around each element's union: ENGINE_NOTES, "How the
; Scaleform HUD identifies its elements"); the health and mana bars interleave, hence
; one 'vitals' row. Unset = unmeasured (rides 'default'). `hud region <name> ...`.
Region.vitals=0.000,0.000,0.200,0.270
Region.reticle=0.470,0.470,0.530,0.530
Region.prompt=0.520,0.460,0.800,0.620
; The window (shared by 'window' and 'world'): distance and width in metres; Height 0 =
; the texture's aspect, else a centred crop; Up and Lateral offset it in its plane.
WindowDistance=1.390
WindowWidth=1.210
WindowHeight=0.000
WindowUp=-0.100
WindowLateral=0.000
; The two hand panels (38.92's values): X/Y/Z an offset in the grip's own frame; Lift
; along world up; Width in metres; Orient billboard (faces the head, never rolls: what
; 38.92 did) or grip (a watch face on the back of the hand, Tilt degrees toward the
; eyes). `hud hand l|r x|y|z|lift|width|tilt <v>`, `hud hand l|r billboard|grip`.
HandL.X=0.000
HandL.Y=0.000
HandL.Z=0.000
HandL.Lift=0.203
HandL.Width=0.400
HandL.Orient=grip
HandL.Tilt=-31.000
HandR.X=0.028
HandR.Y=-0.006
HandR.Z=0.081
HandR.Lift=0.135
HandR.Width=0.220
HandR.Orient=billboard
HandR.Tilt=2.000
; The alpha (VR-119; core/gfx/blit_quad): how the quads' transparency is derived from the
; sink. repair = max(r,g,b) (what 41.2 shipped; dark strokes such as text outlines go faint);
; captured = the sink's own coverage, which the redirect then forces on every HUD draw
; (separate alpha ONE/INVSRCALPHA, eight SetRenderState calls per draw); mix = the larger
; of the two with repair scaled by AlphaMix. AlphaGain multiplies the alpha, AlphaFloor
; is a minimum for any pixel with colour (keeps thin strokes), AlphaGamma nudges the
; colour. Backdrop.window/hand=r,g,b,a composes a plate UNDER the quads of that anchor
; (a=0: none). Every value at identity is 41.2's picture. `hud alpha mode|gain|floor|
; gamma|mix|backdrop ...` live, the F10 HUD tab; `dump hud` writes the alpha as grey.
AlphaMode=repair
AlphaGain=1.000
AlphaFloor=0.000
AlphaGamma=1.000
AlphaMix=1.000
Backdrop.window=0.000,0.000,0.000,0.000
Backdrop.hand=0.000,0.000,0.000,0.000
