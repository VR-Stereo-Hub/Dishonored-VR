; Dishonored VR config - edit while game is closed
; (auto-refreshed when the mod's defaults change)
[Meta]
Version=13
[Tracking]
; head tracking drives the game camera via mouse emulation.
; Calibrate: pick a landmark, turn your head 90 degrees; if the
; world turns less than you did, RAISE CountsPerDegree; if more, lower.
Enabled=1
YawCountsPerDegree=11.5
PitchCountsPerDegree=11.5
InvertPitch=0
; HeightOffsetM shifts the eyes vertically (metres, negative = lower). +0.060 is
; headset-judged 2026-09-05, arrived at by ear across the arm-decoupling runs
; (-0.090 -> -0.050 -> +0.060 as the arms stopped moving and the scale settled).
; It pairs with [PosTrack] Scale=108 from the same session - eye height and world
; scale are judged together, so moving one alone will read as wrong.
; F10 View tunes it per person, SAVE AS DEFAULTS writes it back.
HeightOffsetM=0.060
[Stereo]
PairTrace=1
DrawCallerTrace=1
RingLedger=1
LateTagRepair=1
; Method=mono|aer|reentry: the rung of the stereo ladder (docs/ARCHITECTURE.md).
; reentry (ships, 41.1) draws the scene twice per tick, once per eye, into a
; projection layer - native stereo, HEADSET-VERIFIED on a Quest 3 (2026-09-03); mono
; shows the game on a head-locked screen in both eyes (the fallback, and what a
; refused method leaves running); aer is a design stub and refuses with a note.
; `stereo <name>` switches live and fails soft. Armed=1|0: whether the selected method
; RUNS (the F10 Display tickbox, `stereo arm on|off`); 0 parks the game on the mono
; screen without forgetting the selection. C5Pair=1 (41.1, session 9): each present's
; eye tag is checked against its camera step from the previous present (pass 2 sits
; exactly one IPD along right of pass 1, nothing else moves inside a tick) and the
; tag ring is realigned when they disagree - the tags rode the other draw across
; every pause, load and re-arm before (the eyes SWAPPED). 0 = the ring's order alone.
Method=reentry
Armed=1
C5Pair=1
; HoldUntagged=N (41.1): a tick that fails the second draw gates presents
; UNTAGGED, and an untagged present is the mono path - the same image in BOTH
; eyes. The error scales with disparity, so it is invisible on distant geometry
; and glaring on the viewmodel at 30-50 cm: the tester saw it as the arms and
; weapon flickering (2026-09-03, mono/s 1-4 against out/s 220). N holds up to N
; CONSECUTIVE untagged presents back - the previous pair is re-submitted, so the
; compositor genuinely keeps showing it - before letting one through as mono, so
; a real transition (menu, load, cinematic) still reaches mono within N presents.
; 3 ships: HEADSET-JUDGED on a Quest 3 (2026-09-03), mono/s 1-4 -> 0 with every
; other flicker gone. 0 = OFF, the pre-41.1 behaviour, and the A/B for it.
; `stereo hold <n>` live; `stereo status` and the beat report how many were held.
HoldUntagged=3
; Set from the tested machine's ini (VR-72): F10 panel and calibration keys.
LagAB=0
SingleTagRepair=1
[Camera]
HeadBasedMovement=1
; EyeField= the camera field the per-eye offset is written to. 0x330 was measured
; 2026-09-02 with `camera eyetest` (HONOURED 119/120; docs/dishonored/ENGINE_NOTES.md,
; the per-eye camera seam); none disables the write.
EyeField=0x330
; ArmFollowWeight (VR-30): how hard the arms and weapon follow where you LOOK.
; -1 = off, the game's own value stands (ships). 0..1 forces it: 0 should stop the
; arms following the view entirely, 1 is the shipped behaviour written by us instead
; of by the engine (a control - if 1 looks stock, the write is landing).
; Measured 2026-09-05: the engine RECOMPUTES these weights every frame (they ride
; 0.982..1.000 and never leave it), so this is written on every script dispatch, the
; same cadence the FOV lever uses to outrun the same recompute. The game's own
; DishonoredCamera.ini m_fDefaultWeight was tried first and does nothing.
; This is ROTATION only; the position channel belongs to a separate ticket.
; `arms follow <0..1>` and `arms follow off` are the live A/B.
ArmFollowWeight=-1
; ArmDisableWeight (VR-30): the OTHER way at the same thing, and the better one.
; Rather than pasting a weight over the engine's recompute (which measured as a
; 1.000<->0.000 fight between dispatches, seen as the arms TRAILING the view), this
; forces the game's own DisableArmFollow influences, so the recompute derives an arm
; follow of 0 by itself and holds it. -1 = off (ships), 1 = full decoupling.
; m_Weight, m_TargetWeight and m_bActive are all written every dispatch, because the
; game pulls the target back to 0 about 60 ms after raising it on its own.
; `arms disable <0..1>` and `arms disable off` are the live A/B.
ArmDisableWeight=1
; ArmLookAtStrength (VR-30): the YAW candidate. ArmDisableWeight above took the
; arms' VERTICAL follow and left the horizontal alone, and forcing the settings
; weights on top of it added nothing - so both of those act on one channel and
; neither reaches yaw. LookAtControl_Camera is the Arkane look-at that aims the
; arms at the view; 0 stops it. -1 = off (ships), 0..1 forces its ControlStrength.
; This one finds the node itself, so it works on a stock install - the mod's older
; [Hands] CameraLookAtStrength writes the same field but is dead behind the
; hand-mesh gate that [Mode] GamepadOnly=1 closes.
; `arms lookat <0..1>` and `arms lookat off` are the live A/B.
ArmLookAtStrength=-1
; ArmCounterYaw (VR-30): THE YAW LEVER, and it ships ON at 1.0.
; Reading the scripts end to end says there is no yaw driver for the arms at all -
; every arm/aim/look mechanism the game exposes is pitch-only or NPC-only. The arms
; yaw because the PAWN yaws: they are bones of its mesh, and the pawn's native
; FaceRotation sets its yaw from the controller every frame. There is nothing to
; switch off. So this SUBTRACTS instead: m_ArmFollowOffset_Rot_Primary/_Secondary
; are the game's own authored arm rotation offsets (Rotators, already scaled by a
; weight the engine respects), and they get a yaw equal and opposite to how far your
; head has turned since the reference. The arms then hold still in the world while
; the view turns, and attachments follow for free because the engine applies it.
; Stick turning moves the BODY yaw, not the head's, so it is untouched - the body
; comes round and the arms come with it, which is what you want.
; 1.0 = hold still, 0.5 = follow at half rate (tune by feel), 0 = write a zero offset
; as a control, -1 = off. `arms yaw <0..2>` and `arms yaw off` are the live A/B.
ArmCounterYaw=-1
; Set from the tested machine's ini (VR-72): F10 panel and calibration keys.
BodyYawLock=-1
ArmStripMeshRot=-1
ArmBodyFacing=1
[Capture]
; Mode=sync|deferred|shared: how the game's frame reaches the headset
; (core/gfx/capture). sync reads the frame back and waits for it every present
; (the old baseline, ~5 ms per present at 1080p, 15 ms at the Quest 3 size);
; deferred copies on the GPU, queues the readback and locks it one present later
; (~2.3 ms at 1080p, ~10 ms at the Quest 3 size; the picture is one present late;
; also resolves a multisampled backbuffer; the fallback when the device cannot
; share); shared (ships, 41.1, headset-judged 2026-09-03) needs [Device] Ex=1 and
; keeps the frame in VRAM (the log's capture/probe lines say). `capture mode <m>` switches
; live; `capture status` prints the cost. shared (needs [Device] Ex=1) keeps the frame
; in VRAM: two shared render targets, each blit fenced by a D3D9 event query;
; SharedWait=0 delivers the previous present's slot (no wait in the common case),
; 1 delivers this present's after its fence (zero latency, the CPU waits for the frame
; in flight). `capture sharedwait on|off` live.
; BboxMs: how often the content-bbox instrument (the FULL/CROPPED line) resamples.
; Each sample is a full-frame GetRenderTargetData + LockRect + row copy on the
; present thread - the same round trip that makes Mode=sync cost 17-21 ms/present -
; so this is a frame-time setting, not a logging one. 0 = only after a size change,
; which is the sample that decides FULL vs CROPPED. `capture bbox off|<ms>` live.
Mode=shared
SharedWait=0
BboxMs=30000
[Pace]
ImageOrientation=1
; The pair pacing levers of the projection layer (stereo reentry), all live on
; the `vrpace` seam word and the F10 Runtime panel; SAVE AS DEFAULTS writes them.
; Ahead=0|1|2: locate the head pose (and the layer's views) this many display
; periods past predictedDisplayTime - a pair that closes after its slot displays a
; slot late, and 1 makes the pose match that slot (the log's `pair phase` line says
; which). Strict=1: a stereo submit whose eye is older than one present shows the
; fresh eye to both eyes for that frame instead of a held eye (the pause/resume
; desync fail-soft). Lag=0|1|2: which locate generation the layer is tagged with
; (1 = one back, the measured default). All ship at today's behaviour.
; SyncHz=0|10..500: lock the pair schedule to this rate instead of letting it
; free-run at whatever the game produces. 0 = off (ships). This is the JUDDER
; lever: a game that cannot hold the headset's rate wants a clean SUBMULTIPLE of
; it, so every frame is held for the same whole number of display slots - 60 or
; 40 on a 120 Hz headset, 45 on 90. An uneven cadence is seen as doubled edges on
; world geometry during a head turn, and the log's `stereo: rate` line says
; UNEVEN CADENCE with the slots-per-frame that names it. `vrpace sync <hz>` and
; `vrpace sync off` are the live A/B; judge it in the headset before saving.
Ahead=0
Strict=0
Lag=2
SyncHz=0
[Perf]
CpuScopes=0
NativeProfile=1
DiagnosticAb=0
BridgeGpu=1
RenderProfile=0
DesktopAb=0
; The tick budget (core/framework/perf): Instruments=1 keeps one record per present
; (eight clock stamps) and prints the `perf: tick` line every 3 s; GpuQueries=1 adds
; the D3D9 timestamp ring behind the `perf: gpu` line (read five presents back, never
; waited on). `perf on|off`, `perf gpu on|off` live; `mark <text>` and the F10 MARK
; button stamp a felt freeze. ForceNoVSync=1 presents without vsync (the game's own
; setting is ignored while the headset paces the game). FrameId=1 runs the frame-
; identity trace (core/gfx/frame_id): a 64x64 thumbnail of every present at four
; stages (the backbuffer, the shared slot, the eye texture, the swapchain image),
; read three presents later, and per left/right pair the `stereo: frameid` line
; says at which stage the two eyes stopped being two pictures. 16 KB per present;
; `frameid on|off|status` live.
Instruments=1
GpuQueries=1
ForceNoVSync=1
FrameId=1
FrameIdEvery=8
; Ab (41.1, VR-67): the performance A/B. 1 = on the FIRST present of a run it starts
; an announced plan of segments, switching ONE lever at a time and returning to the
; baseline between alternatives, then prints a per-segment DISTRIBUTION (p50/p95/p99/
; max and how many intervals ran over twice the median). A window MEAN cannot see a
; frame drop, which is why this exists. Nothing about what is rendered changes, and
; the baseline is restored when the plan ends. `perf ab status|off|restart|seg <ms>`.
Ab=0
[Device]
; Ex=1 creates the game's D3D9 device as D3D9Ex (core/gfx/d3d9ex), which is what lets
; [Capture] Mode=shared keep the frame in VRAM (the CPU readback owned the tick at the
; Quest 3 size: 16 ms of GPU copy per present, measured 2026-09-03). A 9Ex device refuses
; D3DPOOL_MANAGED, which this game asks for on every static texture and buffer, so
; Managed= says what stands in: shadow (a system-memory twin per texture, locks
; redirected; the safe one - the game locks textures READONLY while streaming),
; dynamic (DEFAULT+DYNAMIC: READONLY locks read uncached VRAM), default (textures lose
; their locks), none (the refusals are the measurement). Launch-time: `device ex on|off`
; and the F10 Display tickbox write the key for the NEXT launch. Ships ON since 41.1
; (headset-judged 2026-09-03: the Quest 3 size at the headset's rate); Ex=0 is the
; plain device and the readback capture, the fallback if the 9Ex device misbehaves.
Ex=1
Managed=shadow
; ShadowSurfaces=0|1 (VR-15, the black texture bug). Managed=shadow redirects a lock
; taken on the TEXTURE to its system-memory twin, but the game can also take a
; SURFACE off the texture (GetSurfaceLevel) and lock that - a different vtable, so
; the redirect never sees it and the write lands on the DEFAULT texture, where D3D9
; refuses it and the texture keeps the contents it was created with: black. 1 sends
; that lock to the twin's matching surface too. Ships OFF (0) until a headset says it
; removes black surfaces; `device shadowsurfaces on|off` is the live A/B, and the
; log's `device/upload` verdict says whether the bypass is happening at all.
ShadowSurfaces=0
; ShadowFullCopy=0|1 (VR-15, the black texture bug). SOLVED and headset-judged
; 2026-09-05: this was the black texture bug. The shadow used to push a written
; texture with UpdateTexture, which takes NO LEVEL, and writes to mip levels above
; 0 were not being carried - so a surface was black at DISTANCE (small mips) and
; correct up close (level 0). The game locks level>0 fifty thousand times in one
; load and never calls AddDirtyRect once. 1 pushes exactly the level the unlock
; wrote, with UpdateSurface, which names its two surfaces and cannot be vague about
; which level it copied; a format that refuses is remembered and goes straight to
; UpdateTexture from then on, so a refusal is paid for once, not every unlock.
; SHIPS ON (1) - a deliberate exception to 'every render lever ships OFF', made
; because 0 is a visible rendering bug, the same call as [Stereo] HoldUntagged.
; `device shadowfullcopy on|off` is the live A/B; 0 restores the fault.
ShadowFullCopy=1
[Screen]
; Gameplay horizontal FOV; 0 restores headset-derived. Live: projectionfov 60..120|off.
ProjectionFov=103.00
AnchorCinematic=1
AnchorMissionStats=1
AnchorStore=1
AnchorWheel=1
AnchorJournal=1
AnchorNote=1
AnchorPause=1
AnchorLoading=1
AnchorMainMenu=1
AnchorOther=1
AnchorMono=1
; The mono screen: a head-locked quad DistanceMeters away and WidthMeters
; wide. Per-eye rendering will replace it (docs/ROADMAP.md).
DistanceMeters=1.75
; HeadLocked=1 keeps the screen in front of your eyes (turning your head turns the
; game camera); 0 leaves it standing in the room where you recentered.
HeadLocked=1
WidthMeters=2.4
; RenderWidth/RenderHeight/RenderFullscreen (41.1): the render-resolution picker's
; ask, 0 = the game's own size. It takes effect at the NEXT LAUNCH, and THESE FOUR
; KEYS ARE THE ONLY PLACE THE SIZE LIVES (VR-66): the proxy appends -ResX/-ResY to the
; command line the engine reads, and VirtualMode advertises that same size in the
; adapter's mode list, from this one ask. Editing them by hand is enough; the game's
; own ini is written too but the engine ignores it, and its own setres does nothing on
; this build (both measured). dishonored_vr_launch.txt beside the exe is a MIRROR of
; these keys, rewritten whenever it disagrees - never edit it instead of this.
; A fullscreen size must be a display mode the adapter lists (`res modes`) - or
; VirtualMode=1 makes the proxy advertise it and create the fullscreen device windowed
; with the backbuffer kept, the route to the eye's own near-square size.
; `res <W>x<H>[f|w]` asks live; F10 Display has the picker and the verdict
; (`res: HONOURED` reads the capture, never the requested number).
; 41.1 (session 9): the values the headset judged (Quest 3 through VirtualDesktopXR,
; 2026-09-03/04) - the runtime's recommended per-eye size, asked on the game's command
; line and ADVERTISED by the proxy so the game creates it (VirtualMode=1; without it the
; game falls back to a display mode and the picture is soft). Another headset wants its
; own size: the F10 Display picker writes these three for the next launch, and
; RenderWidth=0 RenderHeight=0 asks for nothing at all (the game's own size).
; 41.1 (session 15, 2026-09-04): 2750x2850 with the HEADSET AT 90 Hz. This pair is one
; setting, not two. The tick at this size is ~11.3 ms and the 90 Hz display period is
; 11.11 ms, so the pair schedule lands 1.00-1.02 display slots per frame and the
; ghosting on a head turn is gone (judged on a Quest 3 over VDXR: none reported at
; 90 Hz, still reported at 120). The SAME size at 120 Hz beats at 1.05-1.11 slots and
; ghosts badly - the fault was never the resolution, it was the tick not dividing into
; the display period. If you change one, check `stereo: rate` for the other.
RenderWidth=2750
RenderHeight=2850
RenderFullscreen=1
VirtualMode=1
; FovLever WRITES the game camera FOV on every script dispatch (0 = off).
; FovLever writes the game's camera FOV every tick (40..160; 0 = off, the game's
; own FOV). 130 filled the old side-by-side render vertically; the mono screen
; shows the frame as the game draws it, so it ships off.
FovLever=0
[Mode]
; GamepadOnly=1 makes the VR controllers behave as a plain gamepad:
; hands, hand mesh, motion aim, motion melee, motion crouch and
; controller Blink aim are all off, and no hand or weapon model is
; scaled. Head tracking, positional tracking and the FOV lever keep
; working. Default 1 while the render is being fitted - set 0 to
; get the motion controls back.
GamepadOnly=0
[VR]
DesktopMirrorOff=1
DesktopMirrorStrictOff=1
ReduceDesktopPresent=1
; Runtime=auto tries the 32-bit OpenXR runtime the system registers (Virtual
; Desktop's VDXR, Oculus) and falls back to the bundled SteamVR shim
; (dvr_steamvr32.dll) when there is none; native|steamvr force one.
Runtime=auto
; XrRuntimeJson= a runtime manifest for this launch (the simulator, or a
; Steam launch that cannot carry XR_RUNTIME_JSON). Empty = the loader's choice.
XrRuntimeJson=
XrHaptics=1
; FpsCap pins the game to a rate (0 = off): 72 with VD at 72 Hz, 45 at 90.
FpsCap=0
; DesktopEyeSource=tag|draw: draw pins by current backbuffer identity (VR-76).
; Live A/B: desktopeye draw|tag. tag is the legacy pin, which leaks the other eye under shared capture.
DesktopEyeSource=draw
DisableBadApiLayers=1
[Paths]
; DataDir= where the harness files go (command.txt, status.json, dumps, the
; shim manifest). Empty = %LOCALAPPDATA%\DishonoredVR. Set it to a folder the
; game and the tools both see for real (docs/VERIFICATION.md gotcha 14).
DataDir=D:\dvr-data
[Controllers]
; A jump, B stealth, X interact, Y lean/adrenaline.
; Menu tap pauses; modifier+menu (or hold menu) opens journal.
; Modifier:0 off,1 right thumbrest,2 R3,4 left thumbrest (3 retired).
; Flip:0 left stick D-pad,1 right stick D-pad. Chord: X+Y as menu.
DpadModifier=1
DpadFlip=0
PauseChord=1
Enabled=1
Deadzone=0.12
Haptics=1
[PosTrack]
ZAccount=1
ZAccountRoll=0
; Stage 5: positional head tracking - lean/peek/crouch with your real
; head. F4 = toggle, F5 = re-center to your current head position.
; Lane=auto|vp|camera: where the offset is applied. vp patches the view-projection
; matrix at c0 (the mono screen's path; attachments do not follow); camera writes it
; into the camera field with the per-eye offset (game/dishonored/camera); auto = vp
; on the mono screen, camera under a projection layer (stereo), where the head's raw
; displacement drives the camera. `postrack lane <l>` switches live; `camera postest
; <R> [U] [F]` measures the travel in uu.
Lane=auto
; Scale = game units per meter. 50 is GingasVR's shipped value and is
; the baseline her release was tuned around, so it is what ships.
; NOTE: 100 is the MEASURED value (1 uu = 1 cm), derived from the
; game's own movement constants - 360 uu/s default and 540 uu/s
; sprint. At 50 those are 7.2 and 10.8 m/s, a world-record sprint
; pace for walking around; at 100 they are a 3.6 m/s jog and a
; 5.4 m/s run. Try 100 as a SINGLE change once the rest of the
; baseline is confirmed good, and keep whichever you prefer.
; Too weak? raise it. Too strong/swimmy? lower it. MaxMeters clamps
; how far it will follow.
; If leaning LEFT moves the world the wrong way set FlipX=1.
Enabled=1
; 108 uu/m: headset-judged 2026-09-05, tuned live with PgDn from 98 and kept.
Scale=108.0
MaxMeters=0.80
; EyeClamp (38.24) keeps the tracked eye inside the engine's own bounds. The
; headset run of 2026-09-19 kept it OFF; 1 restores the clamp and its margin.
EyeClamp=0
FlipX=0
[Neck]
UprightPitchArc=1
; The pitch pivot (41.1). A real head pitches about a point below and behind the
; eyes, so looking up or down moves the eye on an arc. Mode=off|add|cancel, under
; a projection layer only: off = the tracked displacement alone; add = the
; modelled arc is ADDED (a rig without positional tracking, or an arc the tracking is
; not supplying); cancel = the arc is SUBTRACTED, for an engine that already pitches
; its camera about its own neck (then PivotBelowM/PivotBehindM hold the ENGINE's
; numbers, measured by `camera pitchtest`). `neck off|add|cancel [below] [behind]`
; switches live; F10 Comfort has the buttons and sliders. The defaults ARE the
; engine's pivot, MEASURED 2026-09-03 on the simulator (0.321 m below, 0.062 m
; behind: 17 cm of backward travel at +30 deg). cancel SHIPS: the headset run of
; 2026-09-03 judged it right (the user); off and add stay as the live A/B. A human
; neck for `add` is about 0.11 / 0.09.
Mode=cancel
PivotBelowM=0.321
PivotBehindM=0.062
CrouchPivotBelowM=0.000
CrouchPivotBehindM=0.000
RollArc=0
StanceBlendMs=150
[Crosshair]
; VR-57: visual controller guide only; shots and native reticle unchanged.
; Dot/beam share one runtime AIM-pose ray. Fixed distance, no surface trace.
; Live: F10 Aim, or crosshair dot|laser on|off, hand left|right.
Dot=1
Laser=0
Hand=left
DistanceM=8.000
SizeDeg=0.500
; VR-141: the reticle colour, 0..255 each (white). Live: F10 HUD tab.
ColorR=255
ColorG=255
ColorB=255
; Reserved; hiding the game reticle is not implemented in this step.
; BothPoses=1 draws the GRIP pose ray beside the AIM pose ray, at 60
; size, so a headset can name which one lies along the controller.
BothPoses=0
; VR-57 test 1: ControlDot=1 draws a HEAD-anchored dot straight ahead of the
; view at 1.50 m and at DistanceM, with no controller anywhere in it. Both
; must land on one screen point, and that point on the centre of the game's
; own rendered image. Off the centre means the projection layer is misaligned
; with the world it carries; on the centre puts the controller ray back under
; suspicion. `crosshair control on|off` switches it live.
ControlDot=0
HideGame=0
[MotionAim]
; Stage 7.3: hand-aimed projectile weapons (crossbow bolts, pistol
; bullets, grenades). After you pull the fire trigger, the freshly
; spawned projectile is redirected along your controller's ray.
; Hand: which controller aims (left = Corvo's gun hand). PitchOffsetDeg
; tilts the ray down from the controller's raw pose toward a natural
; point (tune live: PageUp = shots land higher, PageDown = lower,
; 5 deg steps; the log prints the value - copy your favorite here).
; FlipRight/FlipUp=1 mirror the ray if left/right or up/down aim is
; reversed. End key = toggle on/off live.
Enabled=0
Hand=left
PitchOffsetDeg=40
WindowMs=1200
MaxDistUU=900
FlipRight=0
FlipUp=0
[Aim]
; VR-57 step 2, READ-ONLY. SeamProbe=1 samples the game's own aim-assist
; cache four times a second and logs it (aimseam: lines): the tick tag,
; whether a target was found, its world position and direction, the
; projected screen point, and how far that direction sits from the view
; and from the controller ray. It answers where the shot's direction
; comes from before anything writes it. Nothing the game reads is
; written. SeamVerbose=1 also logs the instances whose tick tag is not
; moving (the NPC contexts), which is the control.
SeamProbe=0
SeamVerbose=0
; DriveFromHand=1 (VR-57 step 3) WRITES that cache from the controller
; ray instead of reading it: the found flag, the aim position and the aim
; direction, leaving the tick tag, the projected screen point and the
; tracking flag alone. It is the test of whether the fire path reads this
; cache at all - if the bolt still follows the crosshair, it does not.
; DriveDistanceUU is how far along the ray the written aim point sits.
DriveFromHand=0
DriveDistanceUU=800
; ShotProbe (VR-57 Phase 1) measures what the fired bolt actually did against
; what the controller asked for. READ-ONLY: it never writes to the game. The
; number it exists to print is the MISS at the plane of the visible dot, in
; units and metres - not the angle between the bolt and the ray, because a bolt
; launched parallel to the ray from a muzzle offset from the controller misses
; the dot by the whole transverse gap at zero angle. Works with DriveFromHand
; either way, and the drive-off run is the baseline.
ShotProbe=0
; FollowHandTrim (VR-57): transport the hand trim onto the published aim ray,
; so tuning the hand with the numpad carries the dot, the beam and the shot
; with it instead of leaving them on the physical controller. The whole ray
; moves - it rotates about the untrimmed palm origin and then takes the
; trim translation - so it stays attached to the hand the way the weapon does.
; It is NOT a measured barrel axis: any baseline offset between the AIM pose
; and the barrel is preserved. Off returns the AIM-pose ray untouched.
FollowHandTrim=1
; ModelRay: measure the loaded bolt geometry; overrides FollowHandTrim.
ModelRay=1
; FireWatch (VR-57 Phase B) records named script dispatches - anything whose
; name mentions Aim, Fire, Shoot, Launch, Projectile or ViewPoint - and prints
; the ones preceding each scored bolt, with the caller that made them. READ-ONLY.
; The crossbow fire path is native, but Pawn.GetBaseAimRotation is a script
; event, and a native caller reaching a script event goes through ProcessEvent -
; so if the shot asks the pawn for an aim, the ask is visible by name. An empty
; list is a real answer: the seam is wholly native. Needs ShotProbe=1.
FireWatch=0
; Native crossbow launch direction, converging from the muzzle to the controller dot.
; Independent of the old HUD cache drive and MotionAim; live toggle in F10 Aim.
FireFromHand=1
; SourceProbe=1 (VR-166) names every object that asks the shared power-aim helper
; (the one Blink uses) for a vector, and how far that vector sits off the view.
; READ-ONLY. It answers which powers and thrown items one seam could aim by hand.
SourceProbe=0
; InteractFromHand=1 (VR-166): what you can pick up, open or use is chosen along the
