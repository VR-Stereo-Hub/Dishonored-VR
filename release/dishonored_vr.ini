WristRoll=0
[Melee]
; Swing the RIGHT controller to attack with the sword. Your trigger still
; attacks as before: a swing ADDS a short press of the attack, it never
; replaces the trigger. CooldownMs paces combos (one swing = one strike).
; F10 > Controls > Motion sword shows your PEAK hand speed live; tune from it.
;
; Detector picks how a swing is recognised:
;   sustain  a swing must stay above SwingSpeed (m/s) for SwingMs AND travel
;            SwingDistM, then the attack is pressed for HoldMs. The original
;            detector, kept so the two can be compared in the headset.
;   edge     the attack fires the instant your hand speed crosses EdgeSpeed,
;            so the game's own wind-up lands the hit where your arm is going.
;            Your head's movement is subtracted (HeadRel), so turning your
;            body is not a swing. Needs the sword in your hand (RequireSword),
;            a gameplay view, no grip held and the F10 overlay closed.
; edge is the default since it was judged in a headset (2026-09-20). Switch
; live with the command `swing mode sustain` or in F10.
Enabled=1
Detector=edge
SwingSpeed=1.8
SwingMs=120
SwingDistM=0.25
HoldMs=220
CooldownMs=200
; edge: EdgeSpeed is the hand speed (m/s) that counts as a swing. Swings not
; registering? lower it toward your PEAK. Attacking while you walk or reach?
; raise it. RearmSpeed is how slow the hand must get before the next swing
; can fire (never above 0.9 x EdgeSpeed); raise it if fast combos drop swings.
; The log counts every hand movement by its peak speed (`swing: census`), the
; ones that attacked and the ones that did not: EdgeSpeed belongs in the gap
; between the two lists. EdgeTravelM makes a swing cover that many metres
; before it can attack (0 = off); it delays a real swing, it never refuses one.
; EdgeSpeedRev marks that the 3.6 -> 3.0 default change has been applied once.
EdgeSpeed=3.0
EdgeSpeedRev=1
EdgeTravelM=0
RearmSpeed=1.0
; edge: the attack is pressed for PulseMs, and at least until the game has
; read the pad PulseMinPolls times (a hitch can swallow a short press).
PulseMs=120
PulseMinPolls=2
HeadRel=1
; Median=1 decides on the middle of the last three speed readings, so one bad
; tracking sample can never swing the sword. Costs one frame. 0 = raw.
Median=1
RequireSword=1
; Output is the pad input a swing presses: rt (right trigger) or rb (right
; shoulder). Leave rt unless the log says `swing: NOT HONOURED ... the game
; BLOCKED instead`, which means this install binds the attack the other way.
Output=rt
; After a swing the mod watches for the game to start the attack and logs
; HONOURED or NOT HONOURED; HonourMs is how long it watches. HonourHaptic=1
; adds a second, softer tick when the game confirms it.
HonourMs=600
HonourHaptic=1
Haptic=1
; The sneak kill (needs Detector=edge). Creeping up behind a guard you stab,
; you do not slash: Stab=1 makes a deliberate STAB of the sword hand (the
; motion is StabStyle, below) press the attack while you are crouched, even
; when it is slower than a swing. A FAST stab already counts as a swing. The
; game decides what the attack becomes: behind an unaware guard
; it is the stealth kill. It is its own shape on purpose: a thrust is slower
; than any slash, and lowering the slash speed instead would turn every reach
; into an attack in the middle of a stealth approach.
;   StabSpeed    how fast the hand must EXTEND (m/s) to start a thrust
;   StabTravelM  how far it must extend (m) within StabWindowMs
;   StabRatio    how straight: extension gained / path travelled (0-1)
;   StabForward  how forward: 1 = exactly where you face, 0 = sideways
;   StabArm      sneak = only while crouched; always = standing too (testing)
; Stab not registering? the log line `stab: REJECTED` names the bar it missed
; and by how much - lower that one. ShoulderRightM/DownM/BackM place your right
; shoulder from your head, for a build far from average.
; StabStyle is the MOTION. plunge = the blade is in a reverse grip, so raise your
; fist to about your shoulder and drive it down, a little forward - what Corvo
; does from behind. It must START high (StabStartBelowM = how far below your
; shoulder line it may start), which is what tells it from reaching for loot.
; thrust = straight out from the shoulder, the way you face. With plunge,
; StabForward is how closely the move follows that down-and-forward line.
Stab=1
StabArm=sneak
StabStyle=plunge
StabStartBelowM=0.05
StabSpeed=1.5
StabTravelM=0.20
StabRatio=0.75
StabForward=0.5
StabWindowMs=400
ShoulderRightM=0.17
ShoulderDownM=0.22
ShoulderBackM=0.04
